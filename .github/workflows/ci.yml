name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose build backend

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U vulnscope; then exit 0; fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Run backend tests
        run: docker compose run --rm backend python -m pytest -q

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Stop containers
        if: always()
        run: docker compose down -v

  self-scan:
    name: Self-scan (Bandit on our own backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Fail on medium or high findings
        run: bandit -r backend/app -ll

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test --if-present
      - name: Build
        run: npm run build